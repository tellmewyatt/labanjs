<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>labanjs</title>

  <body>
    <div style="height: 100%; display: flex; flex-direction: column">
      <div style="flex-grow: 1; position: relative; width: 100%">

          <div id="score"></div>
        </div>
      </div>
      <div style="display: flex; flex-direction: row">
        <button id="playbackButton" style="width: 100px; height: 100px">Start Playback</button>
        <button id="reset" style="width: 100px; height: 100px">Reset</button>
        <button id="cueA" style="width: 100px; height: 100px">Cue A</button>
        <button id="cueB" style="width: 100px; height: 100px">Cue B</button>
      </div>
    </div>
